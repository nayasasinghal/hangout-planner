<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore trending hangout places, cafes, games and get live distance and directions.">
    <link rel="stylesheet" href="style.css">
    <title>Explore Places - Outsy</title>
</head>

<body>

    <!-- NAVIGATION BAR -->
    <nav>
        <a href="index.html" class="nav-brand">
            <span class="pixel-brand-icon">⬡</span>
            <span class="brand-text">OUTSY</span>
            <span class="brand-badge">RADAR</span>
        </a>

        <div class="nav-links">
            <a href="index.html">HOME</a>
            <a href="vibefind.html">VIBEFIND</a>
            <a href="explore.html" class="active">EXPLORE</a>
            <a href="fav.html">
                FAVOURITES <span class="nav-badge-count" id="navFavCount" style="display: none;">0</span>
            </a>
            <a href="plan.html">
                PLANS <span class="nav-badge-count" id="navPlanCount" style="display: none;">0</span>
            </a>
        </div>

        <div class="nav-auth" id="navAuthContainer">
            <a href="login.html" class="btn-nav-login">Sign In</a>
        </div>
    </nav>


    <!-- PAGE HEADER -->
    <section class="explore-header">
        <h1>🔍 EXPLORE PLACES</h1>
        <p>Discover real hangout spots, live distances, and instant Google Maps directions.</p>
    </section>


    <!-- SEARCH & CONTROLS -->
    <section class="explore-section">

        <div class="search-controls-wrapper">
            <!-- Search bar with live search & OpenStreetMap API search -->
            <div class="search-input-group">
                <span>🔍</span>
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search cafes, places, areas (e.g. Bandra, Starbucks, Arcade)..."
                    autocomplete="off"
                >
                <button type="button" id="searchSubmitBtn" class="btn-search">Search</button>
            </div>

            <!-- Location Action Bar -->
            <div class="location-action-bar">
                <button type="button" id="btnGetLocation" class="btn-get-location">
                    <span>📍</span> Use My Current Location
                </button>
                <div class="location-status-badge" id="locationStatus">
                    <span>🗺️</span> Default Area: Bandra, Mumbai
                </div>
            </div>
        </div>


        <!-- FILTER BUTTONS -->
        <div class="filter-container">
            <button class="filter-btn active" onclick="filterPlaces('all')">
                ALL
            </button>

            <button class="filter-btn" onclick="filterPlaces('food')">
                🍔 FOOD
            </button>

            <button class="filter-btn" onclick="filterPlaces('cafe')">
                ☕ CAFÉ
            </button>

            <button class="filter-btn" onclick="filterPlaces('movies')">
                🎬 MOVIES
            </button>

            <button class="filter-btn" onclick="filterPlaces('gaming')">
                🎮 GAMING
            </button>

            <button class="filter-btn" onclick="filterPlaces('outdoors')">
                🌳 OUTDOORS
            </button>

            <button class="filter-btn" onclick="filterPlaces('shopping')">
                🛍️ SHOPPING
            </button>

            <button class="filter-btn" onclick="filterPlaces('music')">
                🎵 MUSIC
            </button>
        </div>


        <!-- PLACE CARDS CONTAINER (Dynamic & Curated with Real Photos, Distances & Maps) -->
        <div class="places-container" id="placesContainer">
            <!-- Place cards are rendered dynamically via script.js -->
        </div>

    </section>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="script.js"></script>
</body>

</html>
