
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Outsy - Login</title>
</head>

<body>

    <!-- NAVIGATION BAR -->

    <nav>
        <a href="index.html">HOME</a> |
        <a href="vibefind.html">VIBEFIND</a> |
        <a href="explore.html">EXPLORE</a> |
        <a href="fav.html">FAVOURITES</a> |
        <a href="plan.html">CREATE PLANS</a> |
            </nav>


    <!-- LOGIN HEADER -->

    <section class="login-header">

        <h1>👋 WELCOME TO OUTSY</h1>

        <p>
            Login to save your favourites and manage your plans.
        </p>

    </section>


    <!-- LOGIN FORM -->

    <section class="login-section">

        <form id="loginForm">

            <h2>LOGIN</h2>

            <!-- EMAIL -->

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <!-- PASSWORD -->

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <!-- REMEMBER ME -->

            <div class="remember">

                <input
                    type="checkbox"
                    id="remember"
                >

                <label for="remember">
                    Remember me
                </label>

            </div>


            <!-- LOGIN BUTTON -->

            <button type="submit" id="loginBtn">
                LOGIN
            </button>


            <!-- MESSAGE -->

            <p id="loginMessage"></p>

        </form>

    </section>


    <script src="script.js"></script>

</body>

</html>
