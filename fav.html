<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your saved favourite hangout places and bucket list.">
    <link rel="stylesheet" href="style.css">
    <title>Favourites - Outsy</title>
</head>

<body>

    <!-- NAVIGATION BAR -->
    <nav>
        <a href="index.html" class="nav-brand">
            <span class="pixel-brand-icon">⬡</span>
            <span class="brand-text">OUTSY</span>
            <span class="brand-badge">RADAR</span>
        </a>

        <div class="nav-links">
            <a href="index.html">HOME</a>
            <a href="vibefind.html">VIBEFIND</a>
            <a href="explore.html">EXPLORE</a>
            <a href="fav.html" class="active">
                FAVOURITES <span class="nav-badge-count" id="navFavCount" style="display: none;">0</span>
            </a>
            <a href="plan.html">
                PLANS <span class="nav-badge-count" id="navPlanCount" style="display: none;">0</span>
            </a>
        </div>

        <div class="nav-auth" id="navAuthContainer">
            <a href="login.html" class="btn-nav-login">Sign In</a>
        </div>
    </nav>


    <!-- PAGE HEADER -->
    <section class="fav-header">
        <h1>❤️ SAVED FAVOURITES</h1>
        <p>Your curated hangout wishlist with instant directions and details.</p>
    </section>


    <!-- FAVOURITE PLACES -->
    <section class="fav-section">
        <div class="fav-container" id="favContainer">
            <!-- Favourites will be loaded dynamically from localStorage -->
            <div class="empty-fav">
                <div class="empty-icon">💔</div>
                <h3>No favourites yet!</h3>
                <p>
                    Explore trending cafes, rooftops, and gaming spots, then tap the heart icon to save them here.
                </p>
                <a href="explore.html" class="main-button">
                    🔍 EXPLORE PLACES
                </a>
            </div>
        </div>
    </section>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="script.js"></script>
</body>

</html>
