
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Find Your Vibe</title>
</head>

<body>

    <!-- NAVIGATION BAR -->

    <nav>
        <a href="index.html">HOME</a> |
                <a href="explore.html">EXPLORE</a> |
        <a href="fav.html">FAVOURITES</a> |
        <a href="plan.html">CREATE PLANS</a> |
        <a href="login.html">LOGIN</a>
    </nav>


    <!-- PAGE HEADING -->

    <section class="vibefind-header">

        <h1>✨ VIBEFIND</h1>

        <p>
            Tell us what you're looking for,
            and we'll help you find the perfect hangout.
        </p>

    </section>


    <!-- VIBE SELECTION -->

    <section class="finder">

        <h2>WHAT'S YOUR VIBE?</h2>

        <div class="option-container">

            <button class="option">🍔 Food</button>

            <button class="option">☕ Café</button>

            <button class="option">🎬 Movies</button>

            <button class="option">🎮 Gaming</button>

            <button class="option">🌳 Outdoors</button>

            <button class="option">🛍️ Shopping</button>

            <button class="option">🎵 Music</button>

        </div>


        <!-- BUDGET -->

        <h2>WHAT'S YOUR BUDGET?</h2>

        <div class="option-container">

            <button class="option">💰 Under ₹300</button>

            <button class="option">💰 ₹300 - ₹700</button>

            <button class="option">💰 ₹700 - ₹1500</button>

            <button class="option">💰 ₹1500+</button>

        </div>


        <!-- MOOD -->

        <h2>WHAT ARE YOU IN THE MOOD FOR?</h2>

        <div class="option-container">

            <button class="option">😌 Chill</button>

            <button class="option">🎉 Fun</button>

            <button class="option">🔥 Exciting</button>

            <button class="option">💬 Catch Up</button>

            <button class="option">📸 Aesthetic</button>

        </div>


        <!-- FIND BUTTON -->

        <div class="find-button-container">

            <button id="findBtn" class="main-button">
                🔍 FIND MY VIBE
            </button>

        </div>

    </section>


    <!-- RESULT -->

    <section id="result" class="result">

        <h2>Your Vibe</h2>

        <p id="resultText">
            Select your preferences and click
            "Find My Vibe".
        </p>

    </section>

<script src="script.js"></script>
</body>

</html>
